name: test project 
on: [push, workflow_dispatch]
env:
  MONGO_PASSWORD: '7FRQUFX8VvC1ETA1'
  MONGO_HOST: 'cluster0.tp7f9sn.mongodb.net'
  MONGO_USER: 'AhmedAfifi'
  MONGO_DB:  'DEMO'

jobs:
  test:
    runs-on: ubuntu-latest 
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: install Python 
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' 
      - name: caching requirments
        uses: actions/cache@v4
        with:
          path: ~/cache/pip
      - name: install requirments
        run: pip install -r requirements.txt
      - name: run test data quality 
        run: pytest tests/test_data_quality.py
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: install Python 
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'    
      - name: install requirments
        run: pip install -r requirements.txt
      - name: run build script
        run: python build_output.py
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: transformed_data
          path: artifact/*.csv
  deploy:
    needs: build
    runs-on: ubuntu-latest 
    steps:
      - name: get Code
        uses: actions/checkout@v7
      - name: install Python 
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'  
      - name: install reiquirments
        run: pip install -r requirements.txt
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: transformed_data
          path: data/
      - name: list all files
        run: ls
      - name: deploy 
        run: echo "deploy is done"
      - name: deploy to mongon
        run: python .\deploy_to_mongo.py

